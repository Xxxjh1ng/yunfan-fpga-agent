<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云帆 YunFan · 全自动设计流水线</title>
<style>
  :root{
    --bg:#0e1118; --panel:#151a24; --panel2:#1b212e; --line:#242c3b;
    --fg:#e6ebf5; --dim:#8b96ab; --accent:#4f8cff; --ok:#33d19b;
    --warn:#f2b544; --err:#ff6b6b; --code:#0b0f16; --violet:#a855f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;
         border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141a26,#0e1118);}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .ver{color:var(--dim);font-size:12px}
  header .flow{margin-left:auto;color:var(--dim);font-size:12px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;
         font-size:12px;background:#1c2436;color:#9fb3d1;border:1px solid var(--line)}
  .badge.run{background:#1b2b45;color:#8fc0ff;border-color:#2c4a78}
  .badge.ok{background:#123328;color:#7fe0bd;border-color:#1f5744}
  .badge.bad{background:#3a1a1a;color:#ff9b9b;border-color:#5c2626}
  .wrap{display:grid;grid-template-columns:372px 1fr;gap:16px;padding:16px;align-items:start}
  @media (max-width:1040px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h2{margin:0;padding:11px 14px;font-size:13px;font-weight:600;color:#c8d2e4;
           border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--violet)}
  .card h2 .right{margin-left:auto;font-weight:400;color:var(--dim);font-size:12px}
  .body{padding:14px}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 6px}
  label:first-child{margin-top:0}
  textarea,select,input[type=text],input[type=number]{
    width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font:inherit;outline:none}
  textarea{min-height:104px;resize:vertical;line-height:1.65}
  textarea:focus,select:focus,input:focus{border-color:var(--accent)}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px}
  .seg button{flex:1;background:transparent;border:0;color:var(--dim);padding:6px 8px;border-radius:6px;
              cursor:pointer;font:inherit;font-size:13px}
  .seg button.on{background:#26324a;color:#fff}
  .actions{display:flex;gap:8px;margin-top:14px}
  button.primary{flex:1;background:linear-gradient(135deg,#7c3aed,#4f8cff);color:#fff;border:0;border-radius:9px;
                 padding:12px;font:inherit;font-weight:600;cursor:pointer;letter-spacing:.3px}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:var(--panel2);color:#cfd8e8;border:1px solid var(--line);
               border-radius:9px;padding:12px 14px;cursor:pointer;font:inherit}
  button.ghost:disabled{opacity:.4;cursor:not-allowed}
  .hint{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.6}
  .warnbox{background:#2a2114;border:1px solid #4a3a1c;color:#f0c987;border-radius:8px;
           padding:9px 11px;font-size:12px;line-height:1.6;margin-top:10px}
  /* 进度条 */
  .bar{height:6px;background:#1b2331;border-radius:99px;overflow:hidden;margin:2px 0 14px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
         background:linear-gradient(90deg,#7c3aed,#4f8cff);transition:width .35s ease}
  .barwrap{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .barwrap .pct{font:600 13px Consolas,monospace;color:#9fb3d1;min-width:42px;text-align:right}
  /* 时间线 */
  .node{display:flex;align-items:flex-start;gap:11px;padding:9px 12px;border-radius:9px;
        border:1px solid transparent;transition:background .2s}
  .node+.node{margin-top:2px}
  .node.run{background:#141d2e;border-color:#24406b}
  .node .mark{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:flex;align-items:center;
              justify-content:center;font-size:12px;font-weight:700;margin-top:1px;
              background:#1d2534;color:#5c6a80;border:1px solid #2a3446}
  .node.run .mark{background:#1b3a63;color:#8fc0ff;border-color:#2f5d97;animation:pulse 1.4s infinite}
  .node.done .mark{background:#12372b;color:var(--ok);border-color:#1f5c46}
  .node.failed .mark{background:#3a1a1a;color:var(--err);border-color:#5c2626}
  .node.skipped .mark{background:#1a1f2a;color:#4b5668;border-color:#242c3b}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,140,255,.45)}70%{box-shadow:0 0 0 7px rgba(79,140,255,0)}100%{box-shadow:0 0 0 0 rgba(79,140,255,0)}}
  .node .txt{flex:1;min-width:0}
  .node .name{font-size:13.5px;color:#dbe4f3;display:flex;gap:8px;align-items:baseline}
  .node .phase{font-size:11px;color:#5c6a80}
  .node.pending .name{color:#8b96ab}
  .node .det{font-size:12px;color:#8b96ab;margin-top:1px;word-break:break-all;
             font-family:Consolas,"Cascadia Mono",monospace}
  .node.run .det{color:#9fc0ff}
  .node.done .det{color:#7fb8a2}
  .node.failed .det{color:#ff9b9b}
  .node .time{font:11.5px Consolas,monospace;color:#5c6a80;margin-left:8px;white-space:nowrap}
  /* 日志 */
  .logbox{background:var(--code);height:230px;overflow:auto;padding:10px 13px;
          font:12px/1.6 "Cascadia Mono",Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .logbox .l{display:block}
  .agent{color:#7fb0ff}.ok{color:var(--ok)}.err{color:var(--err)}.dim{color:var(--dim)}.warn{color:var(--warn)}
  .status{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);
          font-size:12px;color:var(--dim);background:#121724}
  .spin{width:11px;height:11px;border:2px solid #3a4152;border-radius:50%;
        border-top-color:var(--accent);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
  .tabs button{background:transparent;border:1px solid transparent;color:var(--dim);
               padding:6px 11px;border-radius:7px;cursor:pointer;font:inherit;font-size:12.5px}
  .tabs button.on{background:#232d40;color:#fff;border-color:var(--line)}
  pre.code{margin:0;background:var(--code);padding:14px;overflow:auto;max-height:420px;
           font:12.5px/1.6 "Cascadia Mono",Consolas,monospace;white-space:pre}
  .k{color:#c792ea}.n{color:#f78c6c}.c{color:#5c6a80;font-style:italic}
  .meta{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);
        font-size:12px;color:var(--dim)}
  .meta b{color:var(--fg);font-weight:600}
  .recent{list-style:none;margin:0;padding:0;max-height:190px;overflow:auto}
  .recent li{padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12px;color:#c3cee2;
             display:flex;justify-content:space-between;gap:8px;font-family:Consolas,monospace}
  .recent li:hover{background:#212a3b}
  .pill{font-size:11px;padding:1px 7px;border-radius:99px;background:#22304a;color:#9fc0ff;white-space:nowrap}
  .pill.sim{background:#1e3b33;color:#7fe0bd}
  .hidden{display:none!important}
  #waveWrap{background:var(--code);overflow:auto;max-height:460px}
  canvas{display:block}
  /* 节点日志弹层 */
  .modal{position:fixed;inset:0;background:rgba(6,9,14,.72);display:flex;align-items:center;
         justify-content:center;z-index:50;padding:40px}
  .modal-box{width:min(980px,92vw);max-height:82vh;background:var(--panel);border:1px solid var(--line);
             border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
             box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .modal-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
              font-size:13px;color:#c8d2e4;background:#131926}
  .modal-head button{margin-left:auto;background:var(--panel2);color:#cfd8e8;border:1px solid var(--line);
                     border-radius:7px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}
  .modal-box pre{margin:0;padding:14px;overflow:auto;background:var(--code);color:#c9d4e6;
                 font:12px/1.6 "Cascadia Mono",Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .node{cursor:pointer}
  .node:hover{background:#161e2c}
</style>
</head>
<body>
<header>
  <h1>云帆 YunFan</h1><span class="ver">v1.0.0</span>
  <span class="badge" id="badge">待命</span>
  <span class="flow">需求解析 → 代码生成 → 仿真验证 → 调试修复 → 硬件部署</span>
</header>

<div class="wrap">
  <!-- 左：任务配置 -->
  <div>
    <div class="card">
      <h2><span class="dot"></span>任务配置</h2>
      <div class="body">
        <div class="seg" id="modeSeg">
          <button data-mode="text" class="on">输入需求</button>
          <button data-mode="spec">示例规格</button>
        </div>

        <div id="textPane">
          <label>需求描述</label>
          <textarea id="req" placeholder="例如：设计一个 8 位 PWM 呼吸灯，50MHz"></textarea>
        </div>
        <div id="specPane" class="hidden">
          <label>基准设计（带参考模型，验证最严格）</label>
          <select id="spec">
            <option value="counter">counter — 4 位可加载计数器</option>
            <option value="pwm">pwm — 占空比可调 PWM</option>
            <option value="crc32">crc32 — 单拍 CRC32</option>
            <option value="uart_tx">uart_tx — UART 发送器</option>
            <option value="vga_timing">vga_timing — VGA 时序发生器</option>
            <option value="led_water">led_water — 8 位流水灯（板卡自检）</option>
            <option value="key_count">key_count — 拨码计数（板卡自检）</option>
            <option value="vga_bars">vga_bars — VGA 彩条（640x480）</option>
          </select>
        </div>

        <label>目标器件</label>
        <select id="device"></select>

        <label>目标板卡（决定引脚约束）</label>
        <select id="board"></select>

        <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
          <input type="checkbox" id="real" checked style="width:auto" />
          <span style="color:#c3cee2">最后一步<b style="color:#ff8a8a">真实烧录</b>到板卡</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <input type="checkbox" id="retry" checked style="width:auto" />
          <span style="color:#c3cee2">失败自动重试一次</span>
        </label>

        <div class="actions">
          <button class="primary" id="goBtn">授权并全自动执行</button>
          <button class="ghost" id="stopBtn" disabled>停止</button>
        </div>
        <div class="hint">一次授权后全程无人值守：设计 → 仿真 → 烧录。<br/>任何一步失败都会停下并说明原因。</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2><span class="dot" style="background:#33d19b"></span>历史运行</h2>
      <div class="body" style="padding:8px">
        <ul class="recent" id="recent"><li class="dim">加载中…</li></ul>
      </div>
    </div>
  </div>

  <!-- 右：可视化 -->
  <div>
    <div class="card">
      <h2><span class="dot" style="background:#4f8cff"></span>流程可视化
        <span class="right" id="stageNow">未开始</span>
      </h2>
      <div class="body">
        <div class="barwrap">
          <div class="bar" style="flex:1;margin:0"><i id="bar"></i></div>
          <span class="pct" id="pct">0%</span>
        </div>
        <div id="timeline"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2><span class="dot" style="background:#f2b544"></span>实时日志
        <span class="right" id="logState">空闲</span>
      </h2>
      <div class="logbox" id="log"><span class="dim">等待开始…</span></div>
      <div class="status">
        <span id="spin" class="spin hidden"></span>
        <span id="statusText">空闲</span>
        <span id="elapsed" style="margin-left:auto"></span>
      </div>
    </div>

    <div class="card hidden" id="resultCard" style="margin-top:16px">
      <h2><span class="dot" style="background:#4f8cff"></span>运行结果</h2>
      <div class="meta" id="meta"></div>
      <div class="tabs" id="tabs">
        <button data-tab="summary" class="on">运行摘要</button>
        <button data-tab="rtl">RTL</button>
        <button data-tab="tb">Testbench</button>
        <button data-tab="wave">波形</button>
      </div>
      <pre class="code" id="pane"></pre>
      <div id="waveWrap" class="hidden"><canvas id="wave"></canvas></div>
    </div>
  </div>
</div>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalTitle">节点日志</span>
      <button id="modalClose">关闭</button>
    </div>
    <pre id="modalBody"></pre>
  </div>
</div>

<script>
window.addEventListener("error", function (e) {
  try {
    var st = document.getElementById("statusText");
    if (st) st.textContent = "脚本错误：" + e.message + " (line " + e.lineno + ")";
    var lg = document.getElementById("log");
    if (lg) {
      var d = document.createElement("div");
      d.style.color = "#ff6b6b";
      d.textContent = "[JS 错误] " + e.message + " @ " + e.lineno + ":" + e.colno;
      lg.appendChild(d);
    }
  } catch (_) {}
});
</script>
<script>
const $ = s => document.querySelector(s);
const AGENTS = ["编排器","需求解析","代码生成","仿真验证","调试修复","硬件部署","仿真","烧录"];

const NODES = [
  { id:"spec",  label:"需求解析",     phase:"①", hint:"自然语言 → 机器可读规格" },
  { id:"rtl",   label:"代码生成",     phase:"①", hint:"LLM 生成 Verilog" },
  { id:"gate",  label:"静态门控",     phase:"①", hint:"端口契约 + Lint 检查" },
  { id:"tb",    label:"Testbench",    phase:"①", hint:"生成激励与检查点" },
  { id:"sim",   label:"设计内仿真",   phase:"①", hint:"iverilog 判定通过/失败" },
  { id:"repair",label:"调试修复",     phase:"①", hint:"最小编辑补丁", optional:true },
  { id:"pnr",   label:"综合与布局布线",phase:"①", hint:"云源 gw_sh → 比特流" },
  { id:"sim2",  label:"波形仿真",     phase:"②", hint:"编译运行 + VCD 波形" },
  { id:"prog",  label:"烧录到板卡",   phase:"③", hint:"programmer_cli" }
];

let mode = "text", currentJob = null, es = null, timer = null, t0 = 0;
let lastResult = null, activeTab = "summary", waveData = null;
let state = {};       // id -> {state, detail, s}
let startedAt = {};   // id -> ms
let nodeLogs = {};    // id -> [line]

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function hlVerilog(src){
  return String(src).split(/(\/\/[^\n]*)/).map((part,i)=>{
    if (i % 2 === 1) return `<span class="c">${escapeHtml(part)}</span>`;
    let t = escapeHtml(part);
    t = t.replace(/\b(module|endmodule|input|output|inout|wire|reg|always|assign|begin|end|if|else|case|endcase|posedge|negedge|parameter|localparam|initial|default|for|integer|generate|endgenerate|timescale)\b/g,'<span class="k">$1</span>');
    t = t.replace(/\b(\d+'[bhd][0-9a-fA-FxXzZ_]+|\d+)\b/g,'<span class="n">$1</span>');
    return t;
  }).join("");
}

/* ---------- 时间线 ---------- */
function renderTimeline(){
  const box = $("#timeline");
  box.innerHTML = NODES.map(n => {
    const st = state[n.id] || { state: "pending", detail: "", s: null };
    const mark = st.state === "done" ? "✓" : st.state === "failed" ? "✗"
               : st.state === "skipped" ? "–" : st.state === "running" ? "◐" : "·";
    const time = st.s != null && st.s >= 0.1 ? `${st.s.toFixed(1)}s` : "";
    return `<div class="node ${st.state}" data-node="${n.id}" ${n.optional && st.state === "pending" ? 'style="display:none"' : ""}>
      <div class="mark">${mark}</div>
      <div class="txt">
        <div class="name">${n.label}<span class="phase">${n.phase}</span></div>
        <div class="det">${escapeHtml(st.detail || n.hint)}</div>
      </div>
      <div class="time">${time}</div>
    </div>`;
  }).join("");
  updateProgress();
}
function updateProgress(){
  const counted = NODES.filter(n => !n.optional);
  const done = counted.filter(n => {
    const s = (state[n.id] || {}).state;
    return s === "done" || s === "failed" || s === "skipped";
  }).length;
  const pct = Math.round(100 * done / counted.length);
  $("#bar").style.width = pct + "%";
  $("#pct").textContent = pct + "%";
}
function setNode(id, st, detail){
  const prev = state[id] || { state: "pending", detail: "", s: null };
  const now = performance.now();
  if (st === "running") startedAt[id] = now;
  let s = prev.s;
  if ((st === "done" || st === "failed") && startedAt[id]) s = (now - startedAt[id]) / 1000;
  state[id] = { state: st, detail: detail || prev.detail, s };
  renderTimeline();
}
function resetPipeline(){
  state = {}; startedAt = {}; nodeLogs = {};
  NODES.forEach(n => { state[n.id] = { state: "pending", detail: "", s: null }; });
  renderTimeline();
  $("#stageNow").textContent = "运行中";
}

/* ---------- 节点日志弹层 ---------- */
$("#timeline").onclick = (ev) => {
  const row = ev.target.closest(".node");
  if (!row) return;
  const id = row.dataset.node;
  const meta = NODES.find(x => x.id === id);
  const lines = nodeLogs[id] || [];
  const st = state[id] || {};
  $("#modalTitle").textContent = `${meta ? meta.label : id} · ${lines.length} 行日志` +
    (st.detail ? ` · ${st.detail}` : "");
  $("#modalBody").textContent = lines.length ? lines.join("\n")
    : "该节点还没有日志（可能尚未执行，或这一步没有额外输出）。";
  $("#modal").classList.remove("hidden");
};
$("#modalClose").onclick = () => $("#modal").classList.add("hidden");
$("#modal").onclick = (ev) => { if (ev.target.id === "modal") $("#modal").classList.add("hidden"); };
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") $("#modal").classList.add("hidden"); });

/* ---------- 日志 ---------- */
function classify(line){
  if (/✅|\[OK\]|通过静态门控|仿真通过|PASS/.test(line)) return "ok";
  if (/❌|\[错误\]|失败|Error|Traceback|FAIL/.test(line)) return "err";
  if (/⚠️|警告|未通过|dry-run/.test(line)) return "warn";
  return "";
}
function appendLog(line){
  const box = $("#log");
  if (box.dataset.started !== "1"){ box.innerHTML = ""; box.dataset.started = "1"; }
  const el = document.createElement("span");
  el.className = "l " + classify(line);
  let html = escapeHtml(line);
  for (const a of AGENTS) html = html.replace(`[${a}]`, `<span class="agent">[${a}]</span>`);
  el.innerHTML = html || "&nbsp;";
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

/* ---------- 状态 ---------- */
function setBusy(on, text){
  $("#goBtn").disabled = on;
  $("#stopBtn").disabled = !on;
  $("#spin").classList.toggle("hidden", !on);
  $("#statusText").textContent = text;
  $("#logState").textContent = on ? "运行中" : text;
  const badge = $("#badge");
  if (on){
    badge.className = "badge run";
    badge.textContent = "执行中…";
  }
  if (on){
    t0 = Date.now();
    timer = setInterval(() => { $("#elapsed").textContent = ((Date.now()-t0)/1000).toFixed(1)+" s"; }, 200);
  } else { clearInterval(timer); $("#elapsed").textContent = ""; }
}

/* ---------- 启动 ---------- */
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b));
  $("#textPane").classList.toggle("hidden", mode !== "text");
  $("#specPane").classList.toggle("hidden", mode !== "spec");
});
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  activeTab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  renderPane();
});

$("#goBtn").onclick = () => {
  const real = $("#real").checked;
  const payload = { mode, device: $("#device").value, board: $("#board").value, real };
  if (mode === "text"){
    payload.text = $("#req").value.trim();
    if (!payload.text) return alert("请先填写需求");
  } else payload.spec = $("#spec").value;

  const tip = real ? "③ 真实烧录：会覆盖板卡当前配置（需下载器已连接）" : "③ 烧录演练：只做 dry-run 校验，不写板卡";
  if (!confirm("即将全自动执行：\n\n① 设计（需求解析 → RTL → 门控 → Testbench → 仿真 → 综合布线 → 比特流）\n② 仿真验证（iverilog + 波形）\n" +
               tip + "\n\n授权后中途不再询问，失败即停。确认开始？")) return;
  startJob(payload);
};

async function startJob(payload){
  const body = Object.assign({ authorized: true, program: true, max_repair: 5,
                               retry: $("#retry").checked }, payload);
  $("#log").dataset.started = "0";
  $("#resultCard").classList.add("hidden");
  waveData = null;
  resetPipeline();
  $("#badge").className = "badge run";
  $("#badge").textContent = "执行中…";
  setBusy(true, "全自动执行中");
  try {
    const r = await fetch("/api/auto", { method:"POST", headers:{"Content-Type":"application/json"},
                                         body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "启动失败");
    currentJob = data.job;
    follow(data.job);
  } catch (e) {
    appendLog("[错误] " + e.message);
    setBusy(false, "启动失败");
  }
}
$("#stopBtn").onclick = async () => {
  if (!currentJob) return;
  await fetch("/api/stop", { method:"POST", headers:{"Content-Type":"application/json"},
                             body: JSON.stringify({ job: currentJob }) });
};

function follow(job){
  if (es) es.close();
  es = new EventSource(`/api/stream?job=${encodeURIComponent(job)}`);
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === "log"){
      appendLog(m.line);
      if (m.node){ (nodeLogs[m.node] = nodeLogs[m.node] || []).push(m.line); }
    }
    else if (m.t === "node") setNode(m.id, m.state, m.detail);
    else if (m.t === "end"){
      es.close(); es = null;
      const ok = m.ok;
      NODES.forEach(n => {
        const st = (state[n.id] || {}).state;
        if (st === "running") setNode(n.id, ok ? "done" : "failed");
      });
      const badge = $("#badge");
      badge.className = "badge " + (ok ? "ok" : "bad");
      badge.textContent = ok ? "完成" : "失败";
      $("#stageNow").textContent = ok ? "全部完成" : "已中止";
      setBusy(false, ok ? "完成" : "失败（见日志）");
      appendLog(ok ? `✅ 全部完成，用时 ${m.elapsed}s` : `❌ 结束，退出码 ${m.code}`);
      if (m.result) showResult(m.result);
      loadState();
    }
  };
  es.onerror = () => { if (es){ es.close(); es = null; } setBusy(false, "连接中断"); };
}

/* ---------- 结果 ---------- */
function showResult(res){
  lastResult = res;
  const has = t => t === "summary" ? !!res.summary : t === "rtl" ? !!res.rtl
                 : t === "tb" ? !!res.tb : t === "wave" ? !!res.has_wave : false;
  if (!["summary","rtl","tb","wave"].some(has)) return;
  $("#resultCard").classList.remove("hidden");

  const bits = [];
  if (res.run_dir) bits.push(`<span>目录 <b>${escapeHtml(res.run_dir)}</b></span>`);
  if (res.bitstream) bits.push(`<span>比特流 <b>${escapeHtml(res.bitstream)} · ${res.bitstream_mb} MB</b></span>`);
  if (res.sim_verdict) bits.push(`<span>仿真 <b>${escapeHtml(res.sim_verdict)}</b></span>`);
  if (res.program_verdict) bits.push(`<span>烧录 <b>${escapeHtml(res.program_verdict)}</b></span>`);
  $("#meta").innerHTML = bits.join("");

  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("hidden", !has(b.dataset.tab)));
  activeTab = has("summary") ? "summary" : has("rtl") ? "rtl" : has("wave") ? "wave" : "tb";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === activeTab));
  renderPane();
}
function renderPane(){
  const pane = $("#pane"), wrap = $("#waveWrap");
  if (!lastResult) return;
  wrap.classList.add("hidden"); pane.classList.remove("hidden");
  if (activeTab === "wave"){
    pane.classList.add("hidden"); wrap.classList.remove("hidden");
    loadWave(lastResult.run_dir);
    return;
  }
  if (activeTab === "summary") pane.innerHTML = escapeHtml(lastResult.summary || "(无摘要)");
  else if (activeTab === "rtl") pane.innerHTML = hlVerilog(lastResult.rtl || "(未生成)");
  else pane.innerHTML = hlVerilog(lastResult.tb || "(无 Testbench)");
}

/* ---------- 波形 ---------- */
async function loadWave(run){
  try {
    if (!waveData || waveData._run !== run){
      const r = await fetch(`/api/wave?run=${encodeURIComponent(run)}`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "无波形");
      d._run = run; waveData = d;
    }
    drawWave(waveData);
  } catch (e) {
    const cv = $("#wave"), ctx = cv.getContext("2d");
    cv.width = 900; cv.height = 80;
    ctx.fillStyle = "#0b0f16"; ctx.fillRect(0,0,900,80);
    ctx.fillStyle = "#8b96ab"; ctx.font = "13px Consolas";
    ctx.fillText("没有波形：" + e.message, 16, 46);
  }
}
function drawWave(data){
  const cv = $("#wave"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const rows = data.signals.length;
  const W = Math.max(720, cv.parentElement.clientWidth - 4);
  const rowH = 28, top = 24, H = top + rows * rowH + 14;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0b0f16"; ctx.fillRect(0, 0, W, H);
  const labelW = 168, padR = 14, plotW = W - labelW - padR;
  const tmax = Math.max(1, data.tmax);
  const x = t => labelW + (t / tmax) * plotW;
  ctx.strokeStyle = "#182031"; ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++){
    const px = labelW + plotW * i / 10;
    ctx.beginPath(); ctx.moveTo(px, top - 6); ctx.lineTo(px, H - 8); ctx.stroke();
  }
  ctx.fillStyle = "#5c6a80"; ctx.font = "11px Consolas";
  for (let i = 0; i <= 10; i++) ctx.fillText(Math.round(tmax * i / 10), labelW + plotW * i / 10 + 2, top - 10);
  ctx.fillText(data.timescale || "", 8, top - 10);
  data.signals.forEach((sig, idx) => {
    const yTop = top + idx * rowH, yHigh = yTop + 4, yLow = yTop + 18, yMid = (yHigh + yLow) / 2;
    ctx.fillStyle = "#c8d2e4"; ctx.font = "12px Consolas";
    const nm = sig.name.length > 22 ? "…" + sig.name.slice(-21) : sig.name;
    ctx.fillText(nm, 8, yMid + 4);
    ctx.fillStyle = "#5c6a80"; ctx.fillText(String(sig.width), labelW - 18, yMid + 4);
    ctx.strokeStyle = "#33d19b"; ctx.lineWidth = 1.4; ctx.beginPath();
    const ch = sig.changes;
    if (sig.width === 1){
      let prev = ch[0][1];
      ctx.moveTo(x(ch[0][0]), prev === "1" ? yHigh : yLow);
      for (let i = 1; i < ch.length; i++){
        const [t, v] = ch[i], px = x(t);
        ctx.lineTo(px, prev === "1" ? yHigh : yLow);
        ctx.lineTo(px, v === "1" ? yHigh : yLow);
        prev = v;
      }
      ctx.lineTo(x(tmax), prev === "1" ? yHigh : yLow);
    } else {
      for (let i = 0; i < ch.length; i++){
        const t2 = i + 1 < ch.length ? ch[i + 1][0] : tmax;
        const x1 = x(ch[i][0]), x2 = x(t2);
        if (x2 - x1 < 2) continue;
        ctx.moveTo(x1, yHigh); ctx.lineTo(x2, yHigh);
        ctx.lineTo(x2, yLow); ctx.lineTo(x1, yLow); ctx.lineTo(x1, yHigh);
      }
    }
    ctx.stroke();
    if (sig.width > 1){
      ctx.fillStyle = "#f78c6c"; ctx.font = "10px Consolas";
      for (let i = 0; i < ch.length; i++){
        const t2 = i + 1 < ch.length ? ch[i + 1][0] : tmax;
        const x1 = x(ch[i][0]), x2 = x(t2);
        if (x2 - x1 < 16) continue;
        const v = ch[i][1];
        const hex = /^[01xz]+$/.test(v) && v.length <= 32
          ? "h" + parseInt(v.replace(/[xz]/g, "0"), 2).toString(16).toUpperCase() : v;
        ctx.fillText(hex, x1 + 3, yMid + 3);
      }
    }
  });
  ctx.fillStyle = "#5c6a80"; ctx.font = "11px Consolas";
  ctx.fillText(`t = ${tmax} ${data.timescale} · ${rows} 个信号`, 8, H - 2);
}

/* ---------- 历史 ---------- */
async function loadState(){
  try {
    const d = await (await fetch("/api/state")).json();
    const ul = $("#recent");
    if (!d.recent.length){ ul.innerHTML = '<li class="dim">暂无记录</li>'; return; }
    ul.innerHTML = "";
    d.recent.filter(x => x.kind === "design").slice(0, 8).forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `<span>${escapeHtml(item.name)}</span>
        <span class="pill ${item.bitstream ? "" : "sim"}">${item.bitstream ? "有比特流" : "仅仿真"}</span>`;
      li.onclick = async () => {
        try {
          const info = await (await fetch(`/api/runinfo?run=${encodeURIComponent(item.name)}`)).json();
          info.ok = true;
          showResult(info);
          // 用历史 auto.json 复原时间线
          if (info.stages){
            resetPipeline();
            const map = { "设计": "pnr", "仿真": "sim2", "烧录": "prog" };
            info.stages.forEach(s => { if (map[s.name]) setNode(map[s.name], s.ok ? "done" : "failed",
              s.skipped ? "已跳过" : (s.verdict || "")); });
            $("#stageNow").textContent = "历史记录";
          }
        } catch (e) {}
      };
      ul.appendChild(li);
    });
  } catch (e) {}
}

let BOARD_INFO = [];
async function loadMeta(){
  try {
    const d = await (await fetch("/api/meta")).json();
    $("#device").innerHTML = d.devices.map(x =>
      `<option value="${escapeHtml(x.name)}">${escapeHtml(x.name)}（${escapeHtml(x.part || "")}）</option>`).join("");
    BOARD_INFO = d.boards || [];
    const savedDev = localStorage.getItem("yunfan_device");
    if (savedDev && d.devices.some(x => x.name === savedDev)) $("#device").value = savedDev;
    renderBoards($("#device").value);
    $("#device").onchange = () => {
      localStorage.setItem("yunfan_device", $("#device").value);
      renderBoards($("#device").value);
    };
    $("#board").onchange = () => {
      const b = BOARD_INFO.find(x => x.name === $("#board").value);
      if (b && b.device) {
        $("#device").value = b.device;
        localStorage.setItem("yunfan_device", b.device);
      }
    };
  } catch (e) {}
}
function renderBoards(deviceName){
  const sel = $("#board");
  if (!sel) return;
  const list = BOARD_INFO.filter(b => !deviceName || b.device === deviceName);
  const use = list.length ? list : BOARD_INFO;
  const cur = sel.value;
  sel.innerHTML = use.map(b =>
    `<option value="${escapeHtml(b.name)}">${escapeHtml(b.name)} · ${escapeHtml(b.device || "")}</option>`).join("");
  if (use.some(b => b.name === cur)) sel.value = cur;
}

$("#req").value = "设计一个 8 位可加载使能计数器，时钟 50MHz，低电平有效的异步复位；load 优先级高于 en，计满后自然回绕";
resetPipeline();
$("#stageNow").textContent = "未开始";
loadMeta(); loadState();
window.addEventListener("resize", () => { if (waveData) drawWave(waveData); });

  const specName = hp.get("autorun");
  const realFlag = hp.get("real") === "1";
  setTimeout(() => startJob({ mode: "spec", spec: specName, real: realFlag }), 500);
}
